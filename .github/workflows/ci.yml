name: DeePonyCap CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  # C-31: FINISH_MATRIX=1 required (see capricorn-tooling/shared/testing/FINISH-MATRIX-CI.md).
  finish-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Finish matrix
        env:
          FINISH_MATRIX: "1"
        run: npm run test:matrix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finish-matrix-shots
          path: qa/finish-loop/shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-results
          path: qa/finish-loop/matrix-results.json
          retention-days: 14
